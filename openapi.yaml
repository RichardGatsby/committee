components:
  schemas:
    ActivityMatch:
      additionalProperties: false
      properties:
        maps:
          items:
            type: string
          type:
            - array
            - "null"
        started_at:
          format: date-time
          type: string
      required:
        - started_at
        - maps
      type: object
    ActivityResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ActivityResponse.json
          format: uri
          readOnly: true
          type: string
        data:
          items:
            $ref: "#/components/schemas/ActivityMatch"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - data
        - total
      type: object
    AddAlbumMatchInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AddAlbumMatchInputBody.json
          format: uri
          readOnly: true
          type: string
        match_group_id:
          description: Match UUID to add
          type: string
        note:
          description: Optional label for this match within the album
          maxLength: 200
          type: string
      required:
        - match_group_id
      type: object
    AddMatchTagInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AddMatchTagInputBody.json
          format: uri
          readOnly: true
          type: string
        tag_ids:
          description: Tag IDs to attach
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
      required:
        - tag_ids
      type: object
    AddPlayerTagInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AddPlayerTagInputBody.json
          format: uri
          readOnly: true
          type: string
        tag_id:
          description: Tag ID to assign
          format: int64
          type: integer
      required:
        - tag_id
      type: object
    Album:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Album.json
          format: uri
          readOnly: true
          type: string
        channel_names:
          description: Up to five distinct channel names seen across the album's matches (most recent first)
          items:
            type: string
          type:
            - array
            - "null"
        cover_map_names:
          description: Up to four distinct map names from the album's matches (most recent first) for the card collage
          items:
            type: string
          type:
            - array
            - "null"
        created_at:
          format: date-time
          type: string
        description:
          type: string
        id:
          type: string
        match_count:
          format: int64
          type: integer
        name:
          type: string
        owner_name:
          description: Display name of the album owner (registered nick, fallback to discord nick)
          type: string
        owner_player_id:
          type: string
        size_counts:
          $ref: "#/components/schemas/AlbumSizeCounts"
          description: Per-size match counts in this album. Powers the size breakdown chip on cards and the default size filter in the viewer.
        updated_at:
          format: date-time
          type: string
        visibility:
          type: string
      required:
        - id
        - owner_player_id
        - name
        - visibility
        - match_count
        - cover_map_names
        - channel_names
        - size_counts
        - created_at
        - updated_at
      type: object
    AlbumMatchItem:
      additionalProperties: false
      properties:
        alpha_captain_id:
          type: string
        alpha_score:
          format: int32
          type:
            - integer
            - "null"
        alpha_teamname:
          type:
            - string
            - "null"
        beta_captain_id:
          type: string
        beta_score:
          format: int32
          type:
            - integer
            - "null"
        beta_teamname:
          type:
            - string
            - "null"
        channel_id:
          type: string
        channel_name:
          type: string
        clips_count:
          format: int64
          type: integer
        comments_count:
          format: int64
          type: integer
        end_time:
          format: date-time
          type:
            - string
            - "null"
        maps:
          items:
            $ref: "#/components/schemas/MapResult"
          type:
            - array
            - "null"
        match_id:
          type: string
        match_score:
          type:
            - string
            - "null"
        note:
          type: string
        rating_avg:
          format: double
          type: number
        rating_count:
          format: int64
          type: integer
        server:
          $ref: "#/components/schemas/ServerInfo"
        size:
          format: int32
          type: integer
        size_label:
          type: string
        start_time:
          format: date-time
          type:
            - string
            - "null"
        state:
          type: string
        tags:
          items:
            type: string
          type:
            - array
            - "null"
        teams:
          $ref: "#/components/schemas/MatchTeams"
        vods_count:
          format: int64
          type: integer
        winner:
          type:
            - string
            - "null"
      required:
        - match_id
        - state
        - size
        - size_label
        - start_time
        - end_time
        - channel_id
        - channel_name
        - winner
        - alpha_score
        - beta_score
        - match_score
        - alpha_teamname
        - beta_teamname
        - tags
        - server
        - maps
        - teams
      type: object
    AlbumMembership:
      additionalProperties: false
      properties:
        album_id:
          type: string
        contains:
          type: boolean
        name:
          type: string
        visibility:
          type: string
      required:
        - album_id
        - name
        - visibility
        - contains
      type: object
    AlbumSizeCounts:
      additionalProperties: false
      properties:
        other:
          format: int64
          type: integer
        six_v_six:
          format: int64
          type: integer
        three_v_three:
          format: int64
          type: integer
      required:
        - six_v_six
        - three_v_three
        - other
      type: object
    ApproveSuggestionBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApproveSuggestionBody.json
          format: uri
          readOnly: true
          type: string
        doc:
          $ref: "#/components/schemas/CalloutDoc"
          description: The merged official draft.
        players:
          additionalProperties:
            $ref: "#/components/schemas/CalloutPlayer"
          description: Players named on the merged doc's positions, keyed by player_id.
          type: object
        revision_id:
          description: The draft revision written; 0 on a dry run.
          format: int64
          type: integer
      required:
        - doc
        - revision_id
        - players
      type: object
    ApproveSuggestionInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApproveSuggestionInputBody.json
          format: uri
          readOnly: true
          type: string
        accepted:
          description: Change ids to merge.
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
        dry_run:
          description: Return the merged guide without saving it.
          type: boolean
        official_version:
          format: int64
          minimum: 0
          type: integer
        reason:
          description: Optional note to the suggester.
          maxLength: 500
          type: string
        resolutions:
          additionalProperties:
            type: string
          description: "For each accepted conflicting change: proposal or current."
          type: object
      required:
        - accepted
        - official_version
      type: object
    AvgMetricBreakdown:
      additionalProperties: false
      properties:
        contribution:
          format: double
          type: number
        weight:
          format: double
          type: number
        z_score:
          format: double
          type: number
      required:
        - z_score
        - weight
        - contribution
      type: object
    BaitBreakdown:
      additionalProperties: false
      properties:
        components:
          additionalProperties:
            format: double
            type: number
          type: object
        flagged:
          type: boolean
        role:
          type: string
        score:
          format: float
          type: number
      required:
        - role
        - score
        - flagged
        - components
      type: object
    BucketStats:
      additionalProperties: false
      properties:
        hits:
          format: int64
          type: integer
        misses:
          format: int64
          type: integer
      required:
        - hits
        - misses
      type: object
    CacheStatsBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CacheStatsBody.json
          format: uri
          readOnly: true
          type: string
        buckets:
          additionalProperties:
            $ref: "#/components/schemas/BucketStats"
          type: object
        tag_sizes:
          additionalProperties:
            format: int64
            type: integer
          type: object
      required:
        - buckets
        - tag_sizes
      type: object
    CalloutArea:
      additionalProperties: false
      properties:
        color:
          description: Pinned fill colour. Empty means auto-assigned.
          pattern: ^(#[0-9a-fA-F]{6})?$
          type: string
        floor:
          description: Floor id. Empty means the area is not tied to a floor.
          type: string
        id:
          pattern: ^[A-Za-z0-9_-]{1,40}$
          type: string
        label_angle:
          description: Rotation of the name in degrees, -90 to 90 (90 reads bottom to top). Empty means horizontal.
          format: double
          maximum: 90
          minimum: -90
          type: number
        label_pos:
          description: Where the name sits, as [x, y] in world units. Empty means placed automatically inside the area.
          items:
            format: double
            type: number
          maxItems: 2
          minItems: 2
          type: array
        label_size:
          description: Name font size in screen pixels, 8 to 28. Empty means the default (13).
          format: double
          maximum: 28
          minimum: 8
          type: number
        name:
          description: Default callout name, used when no override matches. May contain line breaks. Empty means a colour-only area with no name on the map.
          maxLength: 60
          type: string
        note:
          maxLength: 10000
          type: string
        opacity:
          description: Fill strength, 0.05 to 1. Empty means the default. Lets key areas stand out over filler.
          format: double
          maximum: 1
          minimum: 0.05
          type: number
        order:
          description: Draw order within a floor. Higher draws on top.
          format: int64
          type: integer
        overrides:
          items:
            $ref: "#/components/schemas/CalloutOverride"
          maxItems: 20
          type:
            - array
            - "null"
        sizes:
          description: Match sizes the area exists in. Empty means both.
          items:
            enum:
              - 3v3
              - 6v6
            type: string
          maxItems: 2
          type:
            - array
            - "null"
        stages:
          description: Stage ids the area exists in. Empty means every stage. Unlike an override, this shows or hides the whole area.
          items:
            type: string
          maxItems: 20
          type:
            - array
            - "null"
        style:
          description: Fill style. Empty means solid, or hatch for an area off the base floor.
          enum:
            - solid
            - hatch
            - dots
            - outline
          type: string
        team:
          description: Show only from this side's perspective. Empty means both.
          enum:
            - axis
            - allies
          type: string
        vertex_ids:
          description: Polygon corners in drawing order, as ids into the doc's vertex pool.
          items:
            type: string
          maxItems: 200
          minItems: 3
          type:
            - array
            - "null"
        z_max:
          description: Highest world z the area covers.
          format: double
          type: number
        z_min:
          description: Lowest world z the area covers. Unused by the guide; reserved for position lookups.
          format: double
          type: number
      required:
        - id
        - vertex_ids
        - name
        - order
      type: object
    CalloutContributor:
      additionalProperties: false
      properties:
        discord_nick:
          type:
            - string
            - "null"
        nick:
          type:
            - string
            - "null"
        player_id:
          type: string
        revisions:
          description: Saves this editor made up to the published version.
          format: int64
          type: integer
      required:
        - player_id
        - nick
        - discord_nick
        - revisions
      type: object
    CalloutDoc:
      additionalProperties: false
      properties:
        areas:
          items:
            $ref: "#/components/schemas/CalloutArea"
          maxItems: 400
          type:
            - array
            - "null"
        default_hidden:
          description: Layers a reader sees switched off until they turn them on. Empty means every layer shows. The editor ignores it.
          items:
            enum:
              - areas
              - labels
              - markers
              - positions
              - paths
            type: string
          maxItems: 5
          type:
            - array
            - "null"
        floors:
          description: Named vertical levels, for maps with stacked spaces.
          items:
            $ref: "#/components/schemas/CalloutFloor"
          maxItems: 10
          type:
            - array
            - "null"
        markers:
          items:
            $ref: "#/components/schemas/CalloutMarker"
          maxItems: 400
          type:
            - array
            - "null"
        paths:
          description: "Arrows and routes: where a player should move, as a line through points."
          items:
            $ref: "#/components/schemas/CalloutPath"
          maxItems: 400
          type:
            - array
            - "null"
        positions:
          items:
            $ref: "#/components/schemas/CalloutPosition"
          maxItems: 200
          type:
            - array
            - "null"
        schema_version:
          description: Document format version. Always 1.
          enum:
            - 1
          format: int64
          type: integer
        sizes:
          description: Match sizes the whole guide covers. Empty means both; stages can narrow further but never widen past this.
          items:
            enum:
              - 3v3
              - 6v6
            type: string
          maxItems: 2
          type:
            - array
            - "null"
        stages:
          description: The map's stages, in play order.
          items:
            $ref: "#/components/schemas/CalloutStage"
          maxItems: 20
          type:
            - array
            - "null"
        texts:
          description: Free-standing text on the map, not tied to an area.
          items:
            $ref: "#/components/schemas/CalloutText"
          maxItems: 400
          type:
            - array
            - "null"
        vertices:
          additionalProperties:
            items:
              format: double
              type: number
            maxItems: 2
            minItems: 2
            type:
              - array
              - "null"
          description: Shared corner pool, keyed by vertex id, as [x, y] in world units.
          type: object
      required:
        - schema_version
        - stages
        - floors
        - vertices
        - areas
        - markers
        - positions
      type: object
    CalloutFloor:
      additionalProperties: false
      properties:
        id:
          pattern: ^[A-Za-z0-9_-]{1,40}$
          type: string
        name:
          maxLength: 40
          minLength: 1
          type: string
      required:
        - id
        - name
      type: object
    CalloutMapSummary:
      additionalProperties: false
      properties:
        area_count:
          format: int64
          type: integer
        contributors:
          items:
            $ref: "#/components/schemas/CalloutContributor"
          type:
            - array
            - "null"
        map_name:
          type: string
        published_at:
          format: date-time
          type:
            - string
            - "null"
        sizes:
          description: Match sizes the guide has stages for (3v3, 6v6).
          items:
            type: string
          type:
            - array
            - "null"
        stage_count:
          format: int64
          type: integer
      required:
        - map_name
        - sizes
        - area_count
        - stage_count
        - published_at
        - contributors
      type: object
    CalloutMarker:
      additionalProperties: false
      properties:
        floor:
          type: string
        id:
          pattern: ^[A-Za-z0-9_-]{1,40}$
          type: string
        kind:
          enum:
            - dyno_target
            - satchel_target
            - constructible
            - flag
            - command_post
            - carry_objective
            - extraction
            - truck
            - tank
            - escort_vehicle
            - health_cabinet
            - ammo_cabinet
            - team_spawn
            - point_of_interest
          type: string
        label:
          maxLength: 60
          type: string
        note:
          description: Instructions shown when a reader opens the marker.
          maxLength: 10000
          type: string
        opacity:
          description: 0.05 to 1. Empty means fully opaque.
          format: double
          maximum: 1
          minimum: 0.05
          type: number
        pos:
          description: "[x, y] in world units."
          items:
            format: double
            type: number
          maxItems: 2
          minItems: 2
          type:
            - array
            - "null"
        sizes:
          items:
            enum:
              - 3v3
              - 6v6
            type: string
          maxItems: 2
          type:
            - array
            - "null"
        stages:
          items:
            type: string
          maxItems: 20
          type:
            - array
            - "null"
        team:
          enum:
            - axis
            - allies
          type: string
      required:
        - id
        - kind
        - pos
      type: object
    CalloutOverride:
      additionalProperties: false
      properties:
        hidden:
          description: Hide the area entirely when this override applies.
          type: boolean
        name:
          maxLength: 60
          type: string
        sizes:
          description: 3v3 and/or 6v6. Empty means both.
          items:
            enum:
              - 3v3
              - 6v6
            type: string
          maxItems: 2
          type:
            - array
            - "null"
        stages:
          description: Stage ids. Empty means every stage.
          items:
            type: string
          maxItems: 20
          type:
            - array
            - "null"
        team:
          description: "axis or allies: whose perspective the name is from. Empty means both."
          enum:
            - axis
            - allies
          type: string
      type: object
    CalloutPath:
      additionalProperties: false
      properties:
        animated:
          description: Animate the route to show the direction of travel.
          type: boolean
        animation:
          description: "How an animated route moves: flow is a pulse travelling along the line, draw is the line drawing itself from start to finish, dot is a dot running the route like a player. Empty means flow."
          enum:
            - flow
            - draw
            - dot
          type: string
        arrow:
          description: Arrowheads. Empty means one at the end.
          enum:
            - end
            - both
            - none
          type: string
        color:
          description: Line colour. Empty means white.
          pattern: ^(#[0-9a-fA-F]{6})?$
          type: string
        curved:
          description: Draw a smooth curve through the points instead of straight segments.
          type: boolean
        delay:
          description: Seconds before the animation first starts, counted from when the map opens or the reader replays the routes. Lets routes play in order. Empty means 0.
          format: double
          maximum: 30
          minimum: 0
          type: number
        floor:
          type: string
        id:
          pattern: ^[A-Za-z0-9_-]{1,40}$
          type: string
        label:
          maxLength: 60
          type: string
        note:
          maxLength: 10000
          type: string
        once:
          description: Play a draw or dot animation once and hold the finished route instead of repeating. Ignored by flow.
          type: boolean
        opacity:
          format: double
          maximum: 1
          minimum: 0.05
          type: number
        points:
          description: The route in order, as [x, y] world units; travel runs from the first point to the last.
          items:
            items:
              format: double
              type: number
            maxItems: 2
            minItems: 2
            type:
              - array
              - "null"
          maxItems: 100
          minItems: 2
          type:
            - array
            - "null"
        sizes:
          items:
            enum:
              - 3v3
              - 6v6
            type: string
          maxItems: 2
          type:
            - array
            - "null"
        speed:
          description: Animation speed as a multiple of the default, 0.25 to 4. Empty means 1.
          format: double
          maximum: 4
          minimum: 0.25
          type: number
        stages:
          items:
            type: string
          maxItems: 20
          type:
            - array
            - "null"
        style:
          description: Line type. Empty means solid.
          enum:
            - solid
            - dashed
            - dotted
          type: string
        team:
          enum:
            - axis
            - allies
          type: string
        width:
          description: Line width in screen pixels. Empty means 3.
          format: double
          maximum: 12
          minimum: 1
          type: number
      required:
        - id
        - points
      type: object
    CalloutPlayer:
      additionalProperties: false
      properties:
        discord_avatar_id:
          type:
            - string
            - "null"
        discord_id:
          type:
            - string
            - "null"
        discord_nick:
          type:
            - string
            - "null"
        nick:
          type:
            - string
            - "null"
        player_id:
          type: string
      required:
        - player_id
        - nick
        - discord_nick
        - discord_id
        - discord_avatar_id
      type: object
    CalloutPosition:
      additionalProperties: false
      properties:
        class:
          enum:
            - soldier
            - medic
            - engineer
            - fieldop
            - covertops
          type: string
        floor:
          type: string
        hide_name:
          description: Hide the player's nameplate under the position. Only meaningful with player_id.
          type: boolean
        id:
          pattern: ^[A-Za-z0-9_-]{1,40}$
          type: string
        note:
          maxLength: 10000
          type: string
        opacity:
          description: 0.05 to 1. Empty means fully opaque.
          format: double
          maximum: 1
          minimum: 0.05
          type: number
        player_id:
          description: The player who takes this position, as a player_id. Empty means a generic position. Resolved names are in the response's players map.
          type: string
        pos:
          description: "[x, y, z] in world units."
          items:
            format: double
            type: number
          maxItems: 3
          minItems: 3
          type:
            - array
            - "null"
        sizes:
          items:
            enum:
              - 3v3
              - 6v6
            type: string
          maxItems: 2
          type:
            - array
            - "null"
        stages:
          items:
            type: string
          maxItems: 20
          type:
            - array
            - "null"
        team:
          enum:
            - axis
            - allies
          type: string
        yaw:
          description: Facing, in degrees, using the game's convention (0 = +x, counter-clockwise, as /viewpos prints it).
          format: double
          type: number
      required:
        - id
        - pos
        - yaw
        - team
      type: object
    CalloutRevision:
      additionalProperties: false
      properties:
        author_player_id:
          type: string
        created_at:
          format: date-time
          type: string
        discord_nick:
          type:
            - string
            - "null"
        id:
          format: int64
          type: integer
        is_draft:
          type: boolean
        is_published:
          type: boolean
        nick:
          type:
            - string
            - "null"
        note:
          type:
            - string
            - "null"
      required:
        - id
        - created_at
        - note
        - author_player_id
        - nick
        - discord_nick
        - is_draft
        - is_published
      type: object
    CalloutRevisionDoc:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CalloutRevisionDoc.json
          format: uri
          readOnly: true
          type: string
        doc:
          $ref: "#/components/schemas/CalloutDoc"
        id:
          format: int64
          type: integer
        players:
          additionalProperties:
            $ref: "#/components/schemas/CalloutPlayer"
          description: Players named on the doc's positions, keyed by player_id.
          type: object
      required:
        - id
        - doc
        - players
      type: object
    CalloutStage:
      additionalProperties: false
      properties:
        description:
          maxLength: 10000
          type: string
        id:
