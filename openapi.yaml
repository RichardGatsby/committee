  /api/players/{playerId}:
    get:
      description: Returns the full player profile including lifetime stats, per-map breakdowns, weapon career, kill/death exchanges, teammate stats, and nick history. Use ?size= to scope stats to a match size. Use ?map= to add per-map stats.
      operationId: get-player
      parameters:
        - description: Player UUID
          in: path
          name: playerId
          required: true
          schema:
            description: Player UUID
            type: string
        - description: "Match size filter: 6v6, 3v3, other"
          explode: false
          in: query
          name: size
          schema:
            description: "Match size filter: 6v6, 3v3, other"
            type: string
        - description: Channel filter; repeat for multiple. Accepts channel ID or fuzzy channel name. OR semantics.
          explode: true
          in: query
          name: channel
          schema:
            description: Channel filter; repeat for multiple. Accepts channel ID or fuzzy channel name. OR semantics.
            items:
              type: string
            type:
              - array
              - "null"
        - description: "Start date (inclusive), ISO 8601: 2025-12-24"
          explode: false
          in: query
          name: from
          schema:
            description: "Start date (inclusive), ISO 8601: 2025-12-24"
            type: string
        - description: "End date (exclusive), ISO 8601: 2026-03-15"
          explode: false
          in: query
          name: to
          schema:
            description: "End date (exclusive), ISO 8601: 2026-03-15"
            type: string
        - description: Shorthand time window, e.g. 24h, 7d, 2w, 6m, 1y (ignored when from/to set)
          explode: false
          in: query
          name: range
          schema:
            description: Shorthand time window, e.g. 24h, 7d, 2w, 6m, 1y (ignored when from/to set)
            type: string
        - description: "Filter stats to a team side: axis|1|defender or allies|2|attacker. The same parameter scopes UTRO blocks to that side's team_role (etl_ice inversion baked in at scoring time)."
          explode: false
          in: query
          name: team
          schema:
            description: "Filter stats to a team side: axis|1|defender or allies|2|attacker. The same parameter scopes UTRO blocks to that side's team_role (etl_ice inversion baked in at scoring time)."
            type: string
        - description: Alias of ?team. ?team takes precedence if both are set.
          explode: false
          in: query
          name: teams
          schema:
            description: Alias of ?team. ?team takes precedence if both are set.
            type: string
        - description: Filter stats to matches with this map result
          explode: false
          in: query
          name: result
          schema:
            description: Filter stats to matches with this map result
            enum:
              - win
              - loss
              - draw
            type: string
        - description: Divide all countable stats by this unit. round = per round; map = per map play; match = per full match; minute = per minute of playtime. Omit for raw lifetime totals. Ratio fields (kdr, accuracy, distance_spawn_avg, speed_kph_avg, tmp_weighted_avg) and participation counts (rounds, matches, wins) are never divided.
          explode: false
          in: query
          name: avgBy
          schema:
            description: Divide all countable stats by this unit. round = per round; map = per map play; match = per full match; minute = per minute of playtime. Omit for raw lifetime totals. Ratio fields (kdr, accuracy, distance_spawn_avg, speed_kph_avg, tmp_weighted_avg) and participation counts (rounds, matches, wins) are never divided.
            enum:
              - round
              - match
              - map
              - minute
            type: string
        - description: Map filter; repeat for multiple (?map=supply&map=radar). Stats scoped to rounds played on any listed map (OR semantics).
          explode: true
          in: query
          name: map
          schema:
            description: Map filter; repeat for multiple (?map=supply&map=radar). Stats scoped to rounds played on any listed map (OR semantics).
            items:
              type: string
            type:
              - array
              - "null"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProfile"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
