          type: string
      required:
        - url
      type: object
    UserGuide:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UserGuide.json
          format: uri
          readOnly: true
          type: string
        can_moderate:
          description: The viewer is a callout editor and may hide the guide.
          type: boolean
        created_at:
          format: date-time
          type: string
        doc:
          $ref: "#/components/schemas/CalloutDoc"
        forked_from:
          $ref: "#/components/schemas/GuideLineage"
        hidden_reason:
          description: Why moderators hid it. Shown to the owner and moderators only.
          type:
            - string
            - "null"
        is_owner:
          type: boolean
        map_name:
          type: string
        owner:
          $ref: "#/components/schemas/GuidePerson"
        players:
          additionalProperties:
            $ref: "#/components/schemas/CalloutPlayer"
          description: Players named on the doc's positions, keyed by player_id.
          type: object
        revision_id:
          format: int64
          type: integer
        shared_via_playbook:
          type: boolean
        short_id:
          description: "Share id: the guide lives at /guides/g/<short_id>."
          type: string
        status:
          enum:
            - active
            - hidden
          type: string
        title:
          type: string
        updated_at:
          format: date-time
          type: string
        version:
          description: Optimistic-lock token for saves. Owner only; 0 for everyone else.
          format: int64
          type: integer
        visibility:
          enum:
            - private
            - unlisted
          type: string
      required:
        - short_id
        - map_name
        - title
        - visibility
        - status
        - hidden_reason
        - owner
        - forked_from
        - doc
        - revision_id
        - version
        - created_at
        - updated_at
        - is_owner
        - can_moderate
        - shared_via_playbook
        - players
      type: object
    UserGuideSummary:
      additionalProperties: false
      properties:
        area_count:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        hidden_reason:
          type:
            - string
            - "null"
        map_name:
          type: string
        shared_via_playbook:
          type: boolean
        short_id:
          type: string
        status:
          enum:
            - active
            - hidden
          type: string
        title:
          type: string
        updated_at:
          format: date-time
          type: string
        visibility:
          enum:
            - private
            - unlisted
          type: string
      required:
        - short_id
        - map_name
        - title
        - visibility
        - status
        - hidden_reason
        - area_count
        - created_at
        - updated_at
        - shared_via_playbook
      type: object
    VodJump:
      additionalProperties: false
      properties:
        label:
          type: string
        offset_seconds:
          format: int64
          type: integer
      required:
        - label
        - offset_seconds
      type: object
    WeaponInfo:
      additionalProperties: false
      properties:
        has_headshots:
          type: boolean
        name:
          type: string
      required:
        - name
        - has_headshots
      type: object
    WeaponStat:
      additionalProperties: false
      properties:
        accuracy:
          format: float
          type:
            - number
            - "null"
        damage_given:
          format: int32
          type: integer
        damage_received:
          format: int32
          type: integer
        deaths:
          format: int32
          type: integer
        gib_damage:
          format: int32
          type: integer
        headshot_accuracy:
          format: float
          type:
            - number
            - "null"
        headshots:
          format: int32
          type:
            - integer
            - "null"
        hit_regions:
          $ref: "#/components/schemas/HitRegionBreakdown"
        hits:
          format: int32
          type: integer
        kills:
          format: int32
          type: integer
        objective_damage:
          format: int32
          type: integer
        self_damage:
          format: int32
          type: integer
        shots:
          format: int32
          type: integer
        team_damage_given:
          format: int32
          type: integer
        team_damage_received:
          format: int32
          type: integer
        weapon_id:
          format: int32
          type: integer
        weapon_name:
          type: string
      required:
        - weapon_id
        - weapon_name
        - hits
        - shots
        - kills
        - deaths
        - headshots
        - damage_given
        - damage_received
        - team_damage_given
        - team_damage_received
        - self_damage
        - gib_damage
        - objective_damage
        - accuracy
        - headshot_accuracy
        - hit_regions
      type: object
info:
  title: gibhub API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/_internal/cache-stats:
    get:
      description: Bearer-gated. Returns per-bucket hit/miss counters and the number of keys registered under each invalidation tag. Use to verify cache coverage and spot tag bloat.
      operationId: internal-cache-stats
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheStatsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Cache hit/miss counters and tag sizes
      tags:
        - _internal
  /api/_internal/resolve-discord-ids:
    get:
      description: Bearer-gated (dedicated token). Resolves one or more player_ids, and/or every player on a match's roster (?matchId=), to their registered discord_id. Unregistered players are returned with discord_id null.
      operationId: internal-resolve-discord-ids
      parameters:
        - description: player_id(s) to resolve; repeat for multiple (?playerID=uuid1&playerID=uuid2)
          explode: true
          in: query
          name: playerID
          schema:
            description: player_id(s) to resolve; repeat for multiple (?playerID=uuid1&playerID=uuid2)
            items:
              type: string
            type:
              - array
              - "null"
        - description: resolve every player on this match's roster (match_groups.id)
          explode: false
          in: query
          name: matchId
          schema:
            description: resolve every player on this match's roster (match_groups.id)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveDiscordIDsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Batch resolve player_id → discord_id
      tags:
        - _internal
  /api/albums:
    get:
      description: Returns a paginated list of all public user-curated match albums.
      operationId: list-public-albums
      parameters:
        - description: Page number
          explode: false
          in: query
          name: page
          schema:
            default: 1
            description: Page number
            format: int64
            minimum: 1
            type: integer
        - description: Items per page
          explode: false
          in: query
          name: pageSize
          schema:
            default: 20
            description: Items per page
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Optional case-insensitive name substring filter
          explode: false
          in: query
          name: q
          schema:
            description: Optional case-insensitive name substring filter
            maxLength: 64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageAlbum"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List public albums
      tags:
        - albums
  /api/albums/{albumId}:
    get:
      description: Returns an album and its full match list. Public and unlisted albums are accessible to anyone with the link. Private albums return 404 to non-owners.
      operationId: get-album
      parameters:
        - description: Album UUID
          in: path
          name: albumId
          required: true
          schema:
            description: Album UUID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAlbumOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get album
      tags:
        - albums
  /api/auth/callback:
    get:
      description: Handles the OAuth2 callback from Discord, creates a session, and redirects the browser back to the application.
      operationId: auth-callback
      parameters:
        - description: OAuth2 authorization code
          explode: false
          in: query
          name: code
          schema:
            description: OAuth2 authorization code
            type: string
        - description: OAuth2 state parameter
          explode: false
          in: query
          name: state
          schema:
            description: OAuth2 state parameter
            type: string
      responses:
        "302":
          description: Found
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Discord OAuth callback
      tags:
        - auth
  /api/auth/login:
    get:
      description: Redirects the browser to Discord's OAuth2 authorization page. Pass ?redirect_to=URL to return to a specific page after login.
      operationId: auth-login
      parameters:
        - description: URL to redirect to after login
          explode: false
          in: query
          name: redirect_to
          schema:
            description: URL to redirect to after login
            type: string
      responses:
        "302":
          description: Found
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Initiate Discord OAuth login
      tags:
        - auth
  /api/auth/logout:
    post:
      description: Invalidates the current session cookie and redirects to the home page.
      operationId: auth-logout
      responses:
        "302":
          description: Found
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Logout
      tags:
        - auth
  /api/auth/self:
    get:
      description: Returns the authenticated user's profile, connected player IDs, and preferences. Returns 401 if not logged in.
      operationId: auth-self
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Get current user
      tags:
        - auth
  /api/auth/self/etkey:
    post:
      description: Upload an ET Legacy `etkey` file. Its GUID is derived and linked to your account, and the key is stored encrypted so you can download it again. If the GUID already belongs to another account the upload is rejected (409). Requires a configured server vault key (503 otherwise).
      operationId: upload-self-etkey
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  contentMediaType: application/octet-stream
                  description: etkey file
                  format: binary
                  type: string
              type: object
        required: true
      responses:
        "201":
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Upload an etkey to link its GUID
      tags:
        - auth
  /api/auth/self/etkeys/{etkeyId}:
    delete:
      description: Removes the encrypted etkey backup for one of the authenticated account's GUIDs. The GUID itself stays linked; only the stored key is destroyed.
      operationId: delete-self-etkey
      parameters:
        - description: Stored etkey id from the GUID list
          in: path
          name: etkeyId
          required: true
          schema:
            description: Stored etkey id from the GUID list
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSelfEtkeyOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Delete a stored etkey backup
      tags:
        - auth
    get:
      description: Returns the decrypted etkey file (application/octet-stream, attachment named `etkey`) for one of your linked GUIDs. Session-required, rate-limited, and audited. 503 if the server vault key is unset.
      operationId: download-self-etkey
      parameters:
        - in: path
          name: etkeyId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Download a stored etkey
      tags:
        - auth
  /api/auth/self/guids:
    get:
      description: Returns every ETL GUID linked to the authenticated account, each flagged with whether an encrypted etkey backup is stored for it (and its download id if so).
      operationId: list-self-guids
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSelfGUIDsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: List your linked GUIDs
      tags:
        - auth
  /api/auth/self/preferences:
    put:
      description: "Merges the provided key-value pairs into the user's stored preferences. Known keys: enable_colored_names (bool), prefer_discord_names (bool)."
      operationId: auth-update-preferences
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: {}
              description: Preference key/value pairs
              type: object
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Update preferences
      tags:
        - auth
  /api/auth/self/privacy-ack:
    post:
      description: Records that the authenticated user has seen the current version of the data & privacy notice. Idempotent. Clears privacy_ack_required on /api/auth/self.
      operationId: auth-acknowledge-privacy
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Acknowledge privacy notice
      tags:
        - auth
  /api/auth/self/supporter:
    get:
      description: Reports whether the authenticated user is a supporter and, if so, their badge and whether it is shown.
      operationId: get-self-supporter
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfSupporter"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Get your supporter badge
      tags:
        - auth
    put:
      description: Sets the authenticated supporter's badge and whether it is shown. 404 when the user is not a supporter.
      operationId: update-self-supporter
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSelfSupporterInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfSupporter"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Update your supporter badge
      tags:
        - auth
  /api/auth/sessions:
    delete:
      description: Revokes all active sessions for the current user, logging out all devices.
      operationId: auth-delete-all-sessions
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Delete all sessions
      tags:
        - auth
    get:
      description: Returns all active sessions for the current user including device/browser info and last-seen timestamps.
      operationId: auth-sessions
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/SessionResponse"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: List sessions
      tags:
        - auth
  /api/auth/sessions/{sessionId}:
    delete:
      description: Revokes a specific session by its UUID. Can be used to log out other devices.
      operationId: auth-delete-session
      parameters:
        - description: Session UUID
          in: path
          name: sessionId
          required: true
          schema:
            description: Session UUID
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Delete session
      tags:
        - auth
  /api/callouts:
    get:
      description: Every map with a published callout guide, with the match sizes it covers. Maps that only have an unpublished draft are not listed.
      operationId: list-callout-maps
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCalloutMapsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Maps with a callout guide
      tags:
        - callouts
  /api/callouts/visible:
    get:
      description: Returns 200 if the guides are visible to the caller (beta mode off, or caller is a callout editor) and 404 otherwise.
      operationId: callouts-visible
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Check whether callout guides are visible to the current viewer
      tags:
        - callouts
  /api/callouts/{mapName}:
    get:
      description: "A map's published callout guide: named areas, stages, floors, markers and default positions, all in world coordinates. With draft=true a callout editor gets the working draft plus the version token needed to save it."
      operationId: get-map-callouts
      parameters:
        - description: Exact map name, e.g. supply or sw_battery_b3.
          in: path
          name: mapName
          required: true
          schema:
            description: Exact map name, e.g. supply or sw_battery_b3.
            pattern: ^[A-Za-z0-9_.-]{1,64}$
            type: string
        - description: Serve the working draft instead of the published guide. callout_editor only.
          explode: false
          in: query
          name: draft
          schema:
            description: Serve the working draft instead of the published guide. callout_editor only.
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapCallouts"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Map callout guide
      tags:
        - callouts
  /api/callouts/{mapName}/draft:
    put:
      description: Stores the whole document as a new draft revision. The public guide is unchanged until a publish. Send the version you loaded (0 for a map with no guide yet); a stale version is a 409 so two editors cannot overwrite each other. Saving an unchanged document writes no revision. Callout editors only.
      operationId: save-callout-draft
      parameters:
        - in: path
          name: mapName
          required: true
          schema:
            pattern: ^[A-Za-z0-9_.-]{1,64}$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCalloutDraftInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapCallouts"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Save a callout draft
      tags:
        - callouts
  /api/callouts/{mapName}/publish:
    post:
      description: Makes the current draft the public guide, or, with revision_id, an earlier revision (a one-step rollback). Same version rule as saving. Callout editors only.
      operationId: publish-callouts
      parameters:
        - in: path
          name: mapName
          required: true
          schema:
            pattern: ^[A-Za-z0-9_.-]{1,64}$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishCalloutsInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapCallouts"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Publish a callout guide
      tags:
        - callouts
  /api/callouts/{mapName}/revisions:
    get:
      description: A map's saved revisions, newest first, marking which is the draft and which is published. Callout editors only.
      operationId: list-callout-revisions
      parameters:
        - in: path
          name: mapName
          required: true
          schema:
            pattern: ^[A-Za-z0-9_.-]{1,64}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCalloutRevisionsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Callout revision history
      tags:
        - callouts
  /api/callouts/{mapName}/revisions/{revisionId}:
    get:
      description: The document stored at one revision, for previewing or restoring it. Restoring is a normal draft save of this document. Callout editors only.
      operationId: get-callout-revision
      parameters:
        - in: path
          name: mapName
          required: true
          schema:
            pattern: ^[A-Za-z0-9_.-]{1,64}$
            type: string
        - in: path
          name: revisionId
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalloutRevisionDoc"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: One callout revision
      tags:
        - callouts
  /api/channels:
    get:
      description: Returns all known Discord channels (ID + name). Use channel IDs for the ?channel= filter.
      operationId: get-channels
      parameters:
        - description: "Filter by match size: 6v6, 12, 3v3, 6."
          explode: false
          in: query
          name: size
          schema:
            description: "Filter by match size: 6v6, 12, 3v3, 6."
            type: string
        - description: Map filter; repeat for multiple. OR semantics. Channels with no matches on these maps under the current size/time window are omitted.
          explode: true
          in: query
          name: map
          schema:
            description: Map filter; repeat for multiple. OR semantics. Channels with no matches on these maps under the current size/time window are omitted.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Shorthand time window, e.g. 7d, 30d, 90d, 1y (ignored when from/to set). Omit for no time cutoff.
          explode: false
          in: query
          name: range
          schema:
            description: Shorthand time window, e.g. 7d, 30d, 90d, 1y (ignored when from/to set). Omit for no time cutoff.
            type: string
        - description: Inclusive lower bound on match started_at (YYYY-MM-DD). Mutually exclusive with range.
          explode: false
          in: query
          name: from
          schema:
            description: Inclusive lower bound on match started_at (YYYY-MM-DD). Mutually exclusive with range.
            type: string
        - description: Exclusive upper bound on match started_at (YYYY-MM-DD). Mutually exclusive with range.
          explode: false
          in: query
          name: to
          schema:
            description: Exclusive upper bound on match started_at (YYYY-MM-DD). Mutually exclusive with range.
            type: string
        - description: When true, populate channel_meta + per-size formats + first/last/30d/90d activity. Used by the /channels directory; dropdown lookups should leave this off.
          explode: false
          in: query
          name: detailed
          schema:
            description: When true, populate channel_meta + per-size formats + first/last/30d/90d activity. Used by the /channels directory; dropdown lookups should leave this off.
            type: boolean
        - description: When true, return only channels that have at least one row in player_gather_ranks under the current size/time window. Used by the leaderboard channel dropdown for gather-sourced metrics (e.g. gather_streaks) so tournament/event channels with no gather data are omitted.
          explode: false
          in: query
          name: hasGatherData
          schema:
            description: When true, return only channels that have at least one row in player_gather_ranks under the current size/time window. Used by the leaderboard channel dropdown for gather-sourced metrics (e.g. gather_streaks) so tournament/event channels with no gather data are omitted.
            type: boolean
        - description: "When true, return only channels that have at least one row in player_pick_positions under the current size/time window. Used by the channel dropdown for the pick_pos board, which requires exactly one channel. Strictly narrower than hasGatherData: pick tracking started years after rank tracking, so a channel can have gather ranks and no picks."
          explode: false
          in: query
          name: hasPickData
          schema:
            description: "When true, return only channels that have at least one row in player_pick_positions under the current size/time window. Used by the channel dropdown for the pick_pos board, which requires exactly one channel. Strictly narrower than hasGatherData: pick tracking started years after rank tracking, so a channel can have gather ranks and no picks."
            type: boolean
        - description: When true, return only channels with at least one published clip. Used by the clips page's channel filter so channels nobody has ever posted a clip for don't clutter the dropdown.
          explode: false
          in: query
          name: hasClips
          schema:
            description: When true, return only channels with at least one published clip. Used by the clips page's channel filter so channels nobody has ever posted a clip for don't clutter the dropdown.
            type: boolean
