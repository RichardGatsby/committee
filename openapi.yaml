  /api/players/{playerId}/timeline:
    get:
      description: Returns one point per match (cross-map aggregated) covering every chartable per-match metric — accuracy, kdr, damage, revives, headshot %, UTRO, and more — plus each metric's personal all-time [min, max] for client-side normalization. The response never forks on which metrics the caller intends to display, so a metric picker can toggle series without refetching.
      operationId: get-player-timeline
      parameters:
        - description: Player UUID
          in: path
          name: playerId
          required: true
          schema:
            description: Player UUID
            type: string
        - description: "Match size filter: 6v6, 3v3, other"
          explode: false
          in: query
          name: size
          schema:
            description: "Match size filter: 6v6, 3v3, other"
            type: string
        - description: Channel filter; repeat for multiple. Accepts channel ID or fuzzy channel name. OR semantics.
          explode: true
          in: query
          name: channel
          schema:
            description: Channel filter; repeat for multiple. Accepts channel ID or fuzzy channel name. OR semantics.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Map filter; repeat for multiple. OR semantics.
          explode: true
          in: query
          name: map
          schema:
            description: Map filter; repeat for multiple. OR semantics.
            items:
              type: string
            type:
              - array
              - "null"
        - description: "Filter to a team side: axis|1|defender or allies|2|attacker"
          explode: false
          in: query
          name: team
          schema:
            description: "Filter to a team side: axis|1|defender or allies|2|attacker"
            type: string
        - description: Alias of ?team. ?team takes precedence if both are set.
          explode: false
          in: query
          name: teams
          schema:
            description: Alias of ?team. ?team takes precedence if both are set.
            type: string
        - description: "Start date (inclusive), ISO 8601: 2025-12-24"
          explode: false
          in: query
          name: from
          schema:
            description: "Start date (inclusive), ISO 8601: 2025-12-24"
            type: string
        - description: "End date (exclusive), ISO 8601: 2026-03-15"
          explode: false
          in: query
          name: to
          schema:
            description: "End date (exclusive), ISO 8601: 2026-03-15"
            type: string
        - description: Shorthand time window, e.g. 24h, 7d, 2w, 6m, 1y (ignored when from/to set)
          explode: false
          in: query
          name: range
          schema:
            description: Shorthand time window, e.g. 24h, 7d, 2w, 6m, 1y (ignored when from/to set)
            type: string
        - description: round, match, map, or minute — divides each match's per-match sum by that match's own rounds/duration/maps-played. Empty (default) leaves match totals as-is. Ratio metrics (accuracy, kdr, headshot_pct, effective_headshot_pct, tmp_weighted_avg, utro) always stay ratios and ignore this.
          explode: false
          in: query
          name: avgBy
          schema:
            description: round, match, map, or minute — divides each match's per-match sum by that match's own rounds/duration/maps-played. Empty (default) leaves match totals as-is. Ratio metrics (accuracy, kdr, headshot_pct, effective_headshot_pct, tmp_weighted_avg, utro) always stay ratios and ignore this.
            type: string
        - description: Maximum points to return (most recent first).
          explode: false
          in: query
          name: limit
          schema:
            default: 1500
            description: Maximum points to return (most recent first).
            format: int64
            maximum: 5000
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPlayerTimelineOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Player multi-metric timeline
      tags:
        - players
