  /api/players:
    get:
      description: Returns a paginated compact list of all known players. Default sort is last_seen descending. Use ?tags= to filter to players with specific admin tags.
      operationId: list-players
      parameters:
        - description: Page number
          explode: false
          in: query
          name: page
          schema:
            default: 1
            description: Page number
            format: int64
            minimum: 1
            type: integer
        - description: Items per page
          explode: false
          in: query
          name: pageSize
          schema:
            default: 50
            description: Items per page
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: "Sort field: last_seen/created_at/matches_played/rounds_played sort descending; first_seen sorts ascending (oldest first); country sorts ascending (A-Z) with null last; name sorts ascending (A-Z, case-insensitive, colour codes ignored) with null-named players last"
          explode: false
          in: query
          name: sort
          schema:
            default: last_seen
            description: "Sort field: last_seen/created_at/matches_played/rounds_played sort descending; first_seen sorts ascending (oldest first); country sorts ascending (A-Z) with null last; name sorts ascending (A-Z, case-insensitive, colour codes ignored) with null-named players last"
            enum:
              - last_seen
              - first_seen
              - created_at
              - country
              - matches_played
              - rounds_played
              - name
            type: string
        - description: Sort direction override. Omit to use the natural direction for the chosen sort field.
          explode: false
          in: query
          name: order
          schema:
            description: Sort direction override. Omit to use the natural direction for the chosen sort field.
            enum:
              - asc
              - desc
            type: string
        - description: Tag filter; repeat for multiple (?tags=foo&tags=bar). All listed tags must be assigned to the player (AND semantics).
          explode: true
          in: query
          name: tags
          schema:
            description: Tag filter; repeat for multiple (?tags=foo&tags=bar). All listed tags must be assigned to the player (AND semantics).
            items:
              type: string
            type:
              - array
              - "null"
        - description: Country code filter; repeat for multiple (?country=PL&country=DE). ISO 3166-1 alpha-2. Use 'none' to match players with no country set.
          explode: true
          in: query
          name: country
          schema:
            description: Country code filter; repeat for multiple (?country=PL&country=DE). ISO 3166-1 alpha-2. Use 'none' to match players with no country set.
            items:
              type: string
            type:
              - array
              - "null"
        - description: "Match size for the tier filter: 6v6 or 3v3. Required when ?tier= is set; ignored otherwise (does not affect any other column on /api/players)."
          explode: false
          in: query
          name: size
          schema:
            description: "Match size for the tier filter: 6v6 or 3v3. Required when ?tier= is set; ignored otherwise (does not affect any other column on /api/players)."
            type: string
        - description: Gather tier filter; repeat for multiple (?tier=A&tier=B). OR semantics. **Requires ?size=** (3v3 or 6v6) — returns 400 if size is omitted.
          explode: true
          in: query
          name: tier
          schema:
            description: Gather tier filter; repeat for multiple (?tier=A&tier=B). OR semantics. **Requires ?size=** (3v3 or 6v6) — returns 400 if size is omitted.
            items:
              type: string
            type:
              - array
              - "null"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagePlayerListItem"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List players
      tags:
        - players
  /api/players/search:
    get:
      description: Fuzzy search players by ETL nick or Discord nick using trigram similarity. Returns up to `limit` results ordered by match quality. Case-insensitive.
      operationId: search-players
      parameters:
        - description: Fuzzy name search against ETL nick and Discord nick
          explode: false
          in: query
          name: q
          schema:
            description: Fuzzy name search against ETL nick and Discord nick
            minLength: 1
            type: string
        - description: Maximum results to return
          explode: false
