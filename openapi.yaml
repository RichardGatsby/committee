            enum:
              - newest
              - views
            type: string
        - description: Personalized sub-listing; requires a session. Empty is the public published-only listing. 'mine' returns clips you submitted (including auto-detected ones from your own stream) in every status, pending first. 'favorites' returns clips you starred, published and dead only.
          explode: false
          in: query
          name: view
          schema:
            description: Personalized sub-listing; requires a session. Empty is the public published-only listing. 'mine' returns clips you submitted (including auto-detected ones from your own stream) in every status, pending first. 'favorites' returns clips you starred, published and dead only.
            enum:
              - ""
              - mine
              - favorites
            type: string
      responses:
        "200":
