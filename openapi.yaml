  /api/leaderboards:
    get:
      description: |-
        Returns a ranked list of players for a given metric, time range, and optional filters.

        Append `_avg` to any countable metric for a per-round/match/map average (controlled by `avgBy`). Ratio metrics (`kdr`, `accuracy`, `win_rate_*`) are already normalised and have no `_avg` variant.

        **UTRO metrics**

        `metric=utro` — lifetime rolling-EMA UTRO rating from `player_ratings`.

        `metric=utro_shrunken` — applies Bayesian shrinkage `(n*value + k*center)/(n+k)` so low-evidence players are pulled toward the neutral centre.

        UTRO requires `?size=` (size=6 → 3v3, size=12 → 6v6; formats are stored and surfaced separately). `?channel=`, `?map=`, and `?team=` scope the rating to a specific dimension; absent filters select the cross-* aggregate. `range`, `weapon`, and `avgBy` are ignored for UTRO.

        **Identity metric**

        `metric=unique_guids` — counts distinct GUIDs per player (registered users share one player_id across all their GUIDs; unregistered users have one player_id per GUID). ALL filters (size, channel, map, range, minGames, team, weapon, avgBy) are deliberately ignored — this is a global identity stat, not a gameplay slice.

        **Composite metrics**

        `metric=bans` (warnings/count/hours), `metric=spam` (total/say/vsay/team), and `metric=shoves` (given/received) return one row per player carrying every facet for the composite. `?sortBy=` selects which facet drives the row's `value` (and therefore ranking); the other facets are returned as optional fields. Defaults: bans → count, spam → total, shoves → given.
      operationId: get-leaderboard
      parameters:
        - description: |-
            Ranking metric. Use avgBy to control averaging (default: total = raw sum).

            In-game: kills, deaths, kdr, acc (accuracy; alias: accuracy), hs_acc (headshot/hit ratio — global or per-weapon), headshots, damage (alias: dmg), gibs, xp, tmp, eng, revives, playtime (seconds).

            Engagement: eng is engaged seconds over ROUND DURATION, 0..1 (stats.lua 2.8.0+) — the share of the round the player spent fighting or on the objective. Same denominator as tmp, deliberately: eng is tmp times the share of alive time spent active, so it rises with surviving and with fighting alike and reads as higher-is-better. The engaged-over-alive ratio it replaced did not — a player who spawned, fought for eight seconds and died scored ~100% — and is still served on the player endpoints as eng_alive, as the second factor of the breakdown rather than as a ranking. Matches played before 2.8.0 carry no activity data and are excluded from both the value and the minGames count, so a low games figure on this board means few 2.8.0 matches, not few matches.

            Movement: distance, distance_spawn (avg distance per spawn), speed.

            Stances (values in seconds): stance_prone, stance_crouch, stance_sprint, stance_mg, stance_lean, stance_downed, stance_disguise, stance_obj_carrier.

            Objectives: obj_contribution (canonical set + escort-vehicle disables, credited as each player's share of the disable and scaled by GIBHUB_API__VEHICLE_DISABLE_CREDIT_DIVISOR; peak modes exclude the disable credit), obj_planted, obj_defused, obj_destroyed, obj_repaired, obj_taken, obj_repickup, obj_secured, obj_returned, obj_flag_captured, obj_misc, obj_carrierkilled, obj_dropped (tracked but not a contribution).

            Objective records: obj_carry_fastest (alias: docrun) — fastest CLEAN objective carry, in milliseconds, smallest first. This is the one min-is-best metric in the API. A run counts only when the player who stole the objective from its stand is the one who secured it, with no drop, carrier kill, return or repickup in between; interrupted carries score nothing. Requires exactly one ?map= (a carry on adlernest and one on supply are different distances) and uses ?objective= to pick between the objectives on maps carrying two. Ignores avgBy/peak/minGames/weapon/team. Each row is a player's single best run, with the match, round and start leveltime in peak_context and the run's distance in carry_distance_m. Requires stats.lua 2.7.1+ reports: 2.7.0's carrier polling can misreport a run by a second or more, so its runs are stored but filtered out at read time (GIBHUB_API__CARRY_RUN_MIN_STATS_VERSION), and no data exists at all before 2.7.0.

            Win rate: winrate (aliases: win_rate_map, win_rate_match). Default granularity is map; use avgBy=map|match|round to select.

            Per-weapon (?weapon= scopes to that weapon): kills, acc, hs_acc, damage, team_kills, team_kills_received, team_damage.

            Friendly fire: teamkills (composite — set ?sortBy=committed for teamkills dealt or received for times teamkilled; ?weapon= = the blooper board, who teamkills most with that weapon), team_gibs, team_damage (?weapon= breakdown covers native-v2 matches only). The per-direction metrics team_kills / team_kills_received are also valid on their own.

            Misc: games_played, shoves_given, shoves_received.

            Gather streaks (composite — set ?sortBy=win for longest consecutive-win run or loss for longest consecutive-loss run; computed per gather channel, best run across channels): gather_streaks.

            Combat streaks (single-round records; always served as peakRound — the match the record was set in is in peak_context; aliases longest_kill_spree/longest_death_streak/top_multikill): kill_spree, death_streak, multikill.

            Full-spawn deaths (v2+ only — died just after the team's reinforcement wave with no early revive; always served as peakRound, the match is in peak_context): fullspawns (stacked composite — the peak round's deaths broken into the selfkill subset).

            Chat: spam (all), spam_say, spam_vsay, spam_team.

            Bans (requires registered player): ban_warnings, ban_count, ban_hours.

            Skill (requires ?size=): utro, utro_shrunken.

            Bait (requires ?size=): bait_score.

            Gather pick position: pick_pos — average order the player was picked in a gather, smallest first. The API's second min-is-best metric. Requires exactly one ?channel= and a ?size=: pick order only ranks within one channel's player pool, and its range is a function of format (1..4 in a 3v3, 1..10 in a 6v6), so pooling either dimension produces an artefact rather than a ranking. Captained gathers are not picks and contribute nothing to the average — they are reported separately in captain_count, since captaining often is what thins a strong player's pick sample. minGames counts picks. Honours range/from/to, tier and country; ignores map, weapon, team, avgBy and peak.

            Identity: unique_guids — number of distinct GUIDs per player. ALL filters (size/channel/map/range/minGames/team/weapon/avgBy) are ignored for this metric.
          explode: false
          in: query
          name: metric
          schema:
            default: kills
            description: |-
              Ranking metric. Use avgBy to control averaging (default: total = raw sum).

              In-game: kills, deaths, kdr, acc (accuracy; alias: accuracy), hs_acc (headshot/hit ratio — global or per-weapon), headshots, damage (alias: dmg), gibs, xp, tmp, eng, revives, playtime (seconds).

              Engagement: eng is engaged seconds over ROUND DURATION, 0..1 (stats.lua 2.8.0+) — the share of the round the player spent fighting or on the objective. Same denominator as tmp, deliberately: eng is tmp times the share of alive time spent active, so it rises with surviving and with fighting alike and reads as higher-is-better. The engaged-over-alive ratio it replaced did not — a player who spawned, fought for eight seconds and died scored ~100% — and is still served on the player endpoints as eng_alive, as the second factor of the breakdown rather than as a ranking. Matches played before 2.8.0 carry no activity data and are excluded from both the value and the minGames count, so a low games figure on this board means few 2.8.0 matches, not few matches.

              Movement: distance, distance_spawn (avg distance per spawn), speed.

              Stances (values in seconds): stance_prone, stance_crouch, stance_sprint, stance_mg, stance_lean, stance_downed, stance_disguise, stance_obj_carrier.

              Objectives: obj_contribution (canonical set + escort-vehicle disables, credited as each player's share of the disable and scaled by GIBHUB_API__VEHICLE_DISABLE_CREDIT_DIVISOR; peak modes exclude the disable credit), obj_planted, obj_defused, obj_destroyed, obj_repaired, obj_taken, obj_repickup, obj_secured, obj_returned, obj_flag_captured, obj_misc, obj_carrierkilled, obj_dropped (tracked but not a contribution).

              Objective records: obj_carry_fastest (alias: docrun) — fastest CLEAN objective carry, in milliseconds, smallest first. This is the one min-is-best metric in the API. A run counts only when the player who stole the objective from its stand is the one who secured it, with no drop, carrier kill, return or repickup in between; interrupted carries score nothing. Requires exactly one ?map= (a carry on adlernest and one on supply are different distances) and uses ?objective= to pick between the objectives on maps carrying two. Ignores avgBy/peak/minGames/weapon/team. Each row is a player's single best run, with the match, round and start leveltime in peak_context and the run's distance in carry_distance_m. Requires stats.lua 2.7.1+ reports: 2.7.0's carrier polling can misreport a run by a second or more, so its runs are stored but filtered out at read time (GIBHUB_API__CARRY_RUN_MIN_STATS_VERSION), and no data exists at all before 2.7.0.

              Win rate: winrate (aliases: win_rate_map, win_rate_match). Default granularity is map; use avgBy=map|match|round to select.

              Per-weapon (?weapon= scopes to that weapon): kills, acc, hs_acc, damage, team_kills, team_kills_received, team_damage.

              Friendly fire: teamkills (composite — set ?sortBy=committed for teamkills dealt or received for times teamkilled; ?weapon= = the blooper board, who teamkills most with that weapon), team_gibs, team_damage (?weapon= breakdown covers native-v2 matches only). The per-direction metrics team_kills / team_kills_received are also valid on their own.

              Misc: games_played, shoves_given, shoves_received.

              Gather streaks (composite — set ?sortBy=win for longest consecutive-win run or loss for longest consecutive-loss run; computed per gather channel, best run across channels): gather_streaks.

              Combat streaks (single-round records; always served as peakRound — the match the record was set in is in peak_context; aliases longest_kill_spree/longest_death_streak/top_multikill): kill_spree, death_streak, multikill.

              Full-spawn deaths (v2+ only — died just after the team's reinforcement wave with no early revive; always served as peakRound, the match is in peak_context): fullspawns (stacked composite — the peak round's deaths broken into the selfkill subset).

              Chat: spam (all), spam_say, spam_vsay, spam_team.

              Bans (requires registered player): ban_warnings, ban_count, ban_hours.

              Skill (requires ?size=): utro, utro_shrunken.

              Bait (requires ?size=): bait_score.

