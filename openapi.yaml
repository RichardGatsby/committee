          name: from
          schema:
            description: Inclusive lower bound on match started_at (YYYY-MM-DD). Mutually exclusive with range.
            type: string
        - description: Exclusive upper bound on match started_at (YYYY-MM-DD). Mutually exclusive with range.
          explode: false
