            description: Filter to clips linked to these channels; repeat for multiple. OR semantics.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Filter to clips whose resolved Twitch broadcaster is this player — distinct from the clip's submitter, which is whoever posted the link
          explode: false
          in: query
          name: streamer_id
          schema:
            description: Filter to clips whose resolved Twitch broadcaster is this player — distinct from the clip's submitter, which is whoever posted the link
            type: string
        - description: Highlights (clip) or full broadcasts (vod). The two are never mixed in one listing.
          explode: false
          in: query
          name: kind
          schema:
