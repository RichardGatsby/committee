            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Match rating
      tags:
        - matches
    put:
      description: Casts or changes the caller's 1-10 rating and returns the refreshed summary. Open to any logged-in account old enough to vote — playing in the match is not required. One account is one vote per match; re-rating replaces the previous value rather than adding to it.
