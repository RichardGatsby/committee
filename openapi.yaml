            enum:
              - clip
              - vod
            type: string
        - description: Filter to clips linked to a match of this size
          explode: false
          in: query
          name: size
          schema:
            description: Filter to clips linked to a match of this size
            enum:
              - ""
              - 6v6
              - 3v3
              - other
            type: string
        - description: Shorthand time range (e.g. 7d, 30d); ignored if from/to given
          explode: false
          in: query
          name: range
          schema:
            description: Shorthand time range (e.g. 7d, 30d); ignored if from/to given
            type: string
        - description: Start date (YYYY-MM-DD), inclusive
          explode: false
          in: query
          name: from
          schema:
            description: Start date (YYYY-MM-DD), inclusive
            type: string
        - description: End date (YYYY-MM-DD), exclusive
          explode: false
          in: query
          name: to
          schema:
            description: End date (YYYY-MM-DD), exclusive
            type: string
        - description: Case-insensitive title substring filter
          explode: false
          in: query
          name: q
          schema:
            description: Case-insensitive title substring filter
            maxLength: 100
            type: string
        - description: Sort order — views ranks Twitch clips by view_count; non-Twitch clips sort last
          explode: false
          in: query
          name: sort
          schema:
            default: newest
