      description: Returns the top gainers (positive delta) and fallers (negative delta) in UTRO rating across the selected range. Eligibility gates on in-range rounds (?minGames), not lifetime. Delta = latest in-range value − earliest in-range value. v1 supports metric=utro only.
      operationId: get-leaderboard-movers
      parameters:
        - description: Rating metric. v1 supports utro only.
          explode: false
          in: query
          name: metric
          schema:
            default: utro
            description: Rating metric. v1 supports utro only.
            enum:
              - utro
            type: string
        - description: Time window; same syntax as /api/leaderboards. Defaults to 30d for movers (a wide enough window for meaningful deltas).
          explode: false
          in: query
          name: range
          schema:
            default: 30d
            description: Time window; same syntax as /api/leaderboards. Defaults to 30d for movers (a wide enough window for meaningful deltas).
            type: string
        - description: Inclusive lower bound (YYYY-MM-DD).
          explode: false
          in: query
          name: from
          schema:
            description: Inclusive lower bound (YYYY-MM-DD).
            type: string
        - description: Exclusive upper bound (YYYY-MM-DD).
          explode: false
          in: query
          name: to
          schema:
            description: Exclusive upper bound (YYYY-MM-DD).
            type: string
        - description: Match size filter. Required for utro.
          explode: false
          in: query
          name: size
          schema:
            description: Match size filter. Required for utro.
            type: string
        - description: Channel filter.
          explode: true
          in: query
          name: channel
          schema:
            description: Channel filter.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Map filter.
          explode: true
          in: query
          name: map
          schema:
            description: Map filter.
            items:
              type: string
            type:
              - array
              - "null"
        - description: UTRO team-role filter.
          explode: false
          in: query
          name: team
          schema:
            description: UTRO team-role filter.
            type: string
        - description: Alias of ?team.
          explode: false
          in: query
          name: teams
          schema:
            description: Alias of ?team.
            type: string
        - description: Gather tier filter.
          explode: true
          in: query
          name: tier
          schema:
            description: Gather tier filter.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Country filter; same semantics as /api/leaderboards.
          explode: true
          in: query
          name: country
          schema:
            description: Country filter; same semantics as /api/leaderboards.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Minimum rounds the player must have in the selected range (gates on in-range activity, not lifetime). Negative or omitted selects the default of 5.
          explode: false
          in: query
          name: minGames
          schema:
            default: -1
            description: Minimum rounds the player must have in the selected range (gates on in-range activity, not lifetime). Negative or omitted selects the default of 5.
            format: int64
            type: integer
        - description: Number of players to return in each of gainers and fallers.
          explode: false
          in: query
          name: limit
          schema:
            default: 5
            description: Number of players to return in each of gainers and fallers.
            format: int64
            maximum: 20
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardMovers"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Biggest UTRO gainers and fallers
      tags:
        - leaderboards
  /api/maps:
    get:
      description: Returns all distinct map names that have been played, with occurrence counts. Use these values for ?map= filters on /matches, /leaderboards, and /players/{playerId}.
      operationId: get-maps
      parameters:
        - description: "Sort field: name, popularity (alias of occurrences), occurrences, total_matches, total_map_plays, avg_round_duration, shortest_round_duration, fullhold_pct, fullhold_count, draws"
          explode: false
          in: query
          name: sort
          schema:
            default: popularity
            description: "Sort field: name, popularity (alias of occurrences), occurrences, total_matches, total_map_plays, avg_round_duration, shortest_round_duration, fullhold_pct, fullhold_count, draws"
            type: string
        - description: "Sort order: asc or desc. Default desc for stats columns (occurrences, fullhold_pct, etc.); asc for name."
          explode: false
          in: query
          name: order
          schema:
            description: "Sort order: asc or desc. Default desc for stats columns (occurrences, fullhold_pct, etc.); asc for name."
            type: string
        - description: "Filter by match size: 6v6, 3v3, other"
          explode: false
          in: query
          name: size
          schema:
            description: "Filter by match size: 6v6, 3v3, other"
            type: string
        - description: Channel filter; repeat for multiple. Accepts channel ID or fuzzy channel name. OR semantics.
          explode: true
          in: query
          name: channel
          schema:
            description: Channel filter; repeat for multiple. Accepts channel ID or fuzzy channel name. OR semantics.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Shorthand time window, e.g. 24h, 7d, 2w, 6m, 1y (ignored when from/to set). Omit for no time cutoff.
          explode: false
          in: query
          name: range
          schema:
            description: Shorthand time window, e.g. 24h, 7d, 2w, 6m, 1y (ignored when from/to set). Omit for no time cutoff.
            type: string
        - description: Inclusive lower bound on match_started_at (YYYY-MM-DD).
          explode: false
          in: query
          name: from
          schema:
            description: Inclusive lower bound on match_started_at (YYYY-MM-DD).
            type: string
        - description: Exclusive upper bound on match_started_at (YYYY-MM-DD).
          explode: false
          in: query
          name: to
          schema:
            description: Exclusive upper bound on match_started_at (YYYY-MM-DD).
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List maps
      tags:
        - metadata
  /api/matches:
    get:
      description: Returns a paginated list of matches with team rosters and per-map scores. Supports exact filters and fuzzy search. Requests that include search parameters (players, player_ids, teamname, server, tags, with, against, with_player_ids, against_player_ids) bypass the response cache. Use 'with' to require players on the same team side, 'against' to require players on the opposing side. 'teamname' is repeatable with AND semantics.
      operationId: list-matches
      parameters:
        - description: Page number (1-indexed)
          explode: false
          in: query
          name: page
          schema:
            default: 1
            description: Page number (1-indexed)
            format: int64
            minimum: 1
            type: integer
        - description: Items per page
          explode: false
          in: query
          name: pageSize
          schema:
            default: 20
            description: Items per page
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: "Filter by match size: 6v6, 3v3, or other"
          explode: false
          in: query
          name: size
          schema:
            description: "Filter by match size: 6v6, 3v3, or other"
            type: string
        - description: Map name filter; repeat for multiple (?map=missile_b3&map=supply). Matches must include every listed map (AND semantics).
          explode: true
          in: query
          name: map
          schema:
            description: Map name filter; repeat for multiple (?map=missile_b3&map=supply). Matches must include every listed map (AND semantics).
            items:
              type: string
            type:
              - array
              - "null"
        - description: Filter by match state, e.g. finished or cancelled
          explode: false
          in: query
          name: state
          schema:
            description: Filter by match state, e.g. finished or cancelled
            type: string
        - description: "Filter by winning team side: alpha or beta"
          explode: false
          in: query
          name: winner
          schema:
            description: "Filter by winning team side: alpha or beta"
            enum:
              - alpha
              - beta
            type: string
        - description: Channel filter; repeat for multiple. Accepts channel ID or fuzzy channel name. OR semantics.
          explode: true
          in: query
          name: channel
          schema:
            description: Channel filter; repeat for multiple. Accepts channel ID or fuzzy channel name. OR semantics.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Tag name filter; repeat for multiple (?tags=foo&tags=bar). All listed tags must be present on the match (AND semantics). Bypasses cache.
          explode: true
          in: query
          name: tags
          schema:
            description: Tag name filter; repeat for multiple (?tags=foo&tags=bar). All listed tags must be present on the match (AND semantics). Bypasses cache.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Tag name filter with OR semantics; repeat for multiple (?tags_any=pl.season+07&tags_any=pl.season+08). Match included when ANY listed tag is present. Use this for one-of-axes like seasons where a match has at most one tag in the set. Bypasses cache.
          explode: true
          in: query
          name: tags_any
          schema:
            description: Tag name filter with OR semantics; repeat for multiple (?tags_any=pl.season+07&tags_any=pl.season+08). Match included when ANY listed tag is present. Use this for one-of-axes like seasons where a match has at most one tag in the set. Bypasses cache.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Player name token filter; repeat for multiple. Fuzzy-matched against discord nick, ETL nick, aliases, and in-game nicks. All tokens must match at least one player in the match, on any side (AND). Bypasses cache.
          explode: true
          in: query
          name: players
          schema:
            description: Player name token filter; repeat for multiple. Fuzzy-matched against discord nick, ETL nick, aliases, and in-game nicks. All tokens must match at least one player in the match, on any side (AND). Bypasses cache.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Player UUID filter; repeat for multiple. All listed players must appear in the match on any side (AND). Bypasses cache.
          explode: true
          in: query
          name: player_ids
          schema:
            description: Player UUID filter; repeat for multiple. All listed players must appear in the match on any side (AND). Bypasses cache.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Fuzzy substring search against alpha or beta team name (Quake3 colour codes stripped before matching). Repeat for multiple; all listed names must appear in the match (AND). Bypasses cache.
          explode: true
          in: query
          name: teamname
          schema:
            description: Fuzzy substring search against alpha or beta team name (Quake3 colour codes stripped before matching). Repeat for multiple; all listed names must appear in the match (AND). Bypasses cache.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Case-insensitive substring search against server name. Bypasses cache.
          explode: false
          in: query
          name: server
          schema:
            description: Case-insensitive substring search against server name. Bypasses cache.
            type: string
        - description: Players that must appear on the same team side as each other. Repeat for multiple tokens; all must share a side (AND). Fuzzy-matched. Bypasses cache.
          explode: true
          in: query
          name: with
          schema:
            description: Players that must appear on the same team side as each other. Repeat for multiple tokens; all must share a side (AND). Fuzzy-matched. Bypasses cache.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Players that must appear on the opposing side from the 'with' group. Repeat for multiple tokens (AND). Fuzzy-matched. Requires 'with'; standalone 'against' is treated as 'with'. Bypasses cache.
          explode: true
          in: query
          name: against
          schema:
            description: Players that must appear on the opposing side from the 'with' group. Repeat for multiple tokens (AND). Fuzzy-matched. Requires 'with'; standalone 'against' is treated as 'with'. Bypasses cache.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Exact player UUIDs that must all share a team side. AND semantics across values. Bypasses cache.
          explode: true
          in: query
          name: with_player_ids
          schema:
            description: Exact player UUIDs that must all share a team side. AND semantics across values. Bypasses cache.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Exact player UUIDs that must be on the opposing side from 'with'/'with_player_ids'. AND semantics across values. Bypasses cache.
          explode: true
          in: query
          name: against_player_ids
          schema:
            description: Exact player UUIDs that must be on the opposing side from 'with'/'with_player_ids'. AND semantics across values. Bypasses cache.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Shorthand time window, e.g. 24h, 7d, 2w, 6m, 1y (ignored when from/to is set). Omit for no time cutoff.
          explode: false
          in: query
          name: range
          schema:
            description: Shorthand time window, e.g. 24h, 7d, 2w, 6m, 1y (ignored when from/to is set). Omit for no time cutoff.
            type: string
        - description: Inclusive lower bound on started_at (YYYY-MM-DD). Mutually exclusive with range.
          explode: false
          in: query
          name: from
          schema:
            description: Inclusive lower bound on started_at (YYYY-MM-DD). Mutually exclusive with range.
            type: string
        - description: Exclusive upper bound on started_at (YYYY-MM-DD). Mutually exclusive with range.
          explode: false
          in: query
          name: to
          schema:
            description: Exclusive upper bound on started_at (YYYY-MM-DD). Mutually exclusive with range.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageMatchListItem"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List matches
      tags:
        - matches
  /api/matches/live:
    get:
      description: Returns every match currently in progress, newest first, with rosters, map pool and any live streams attached — backs the match list's Live filter. A match counts as live while its state is non-terminal and it has produced a signal (its creation, or a round landing) within the last 30 minutes. Ignores the match list's filters by design, so a live 3v3 still appears while the list is filtered to 6v6. Intended to be polled at 60s.
      operationId: list-live-matches
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListLiveMatchesBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Matches currently live
      tags:
        - matches
  /api/matches/top-rated:
    get:
      description: Matches ranked by user rating, using an IMDb-style Bayesian weighting so a 10.0 from two voters cannot outrank a high average from many. Matches below the minimum vote count are omitted entirely. Filters mirror the match list's eligibility filters (size, channel, map, date); text search is not offered, since the board is a ranking rather than a lookup.
      operationId: list-top-rated-matches
      parameters:
        - description: Page number (1-indexed)
          explode: false
          in: query
          name: page
          schema:
            default: 1
            description: Page number (1-indexed)
            format: int64
            minimum: 1
            type: integer
        - description: Items per page
          explode: false
          in: query
          name: pageSize
          schema:
            default: 20
            description: Items per page
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: weighted = Bayesian score (the ranking); average = raw mean, same vote floor; votes = most-rated first
          explode: false
          in: query
          name: sort
          schema:
            default: weighted
            description: weighted = Bayesian score (the ranking); average = raw mean, same vote floor; votes = most-rated first
            enum:
              - weighted
              - average
              - votes
            type: string
        - description: Override the configured minimum votes a match needs to be listed
          explode: false
          in: query
          name: minVotes
          schema:
            description: Override the configured minimum votes a match needs to be listed
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: "Filter by match size: 6v6, 3v3, or other"
          explode: false
          in: query
          name: size
          schema:
            description: "Filter by match size: 6v6, 3v3, or other"
            type: string
        - description: Channel filter; repeat for multiple. Accepts channel ID or fuzzy channel name. OR semantics.
          explode: true
          in: query
          name: channel
          schema:
            description: Channel filter; repeat for multiple. Accepts channel ID or fuzzy channel name. OR semantics.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Map name filter; repeat for multiple. Matches must include every listed map (AND semantics).
          explode: true
          in: query
          name: map
          schema:
            description: Map name filter; repeat for multiple. Matches must include every listed map (AND semantics).
            items:
              type: string
            type:
              - array
              - "null"
        - description: Shorthand time window, e.g. 24h, 7d, 2w, 6m, 1y (ignored when from/to is set). Omit for no time cutoff.
          explode: false
          in: query
          name: range
          schema:
            description: Shorthand time window, e.g. 24h, 7d, 2w, 6m, 1y (ignored when from/to is set). Omit for no time cutoff.
            type: string
        - description: Inclusive lower bound on started_at (YYYY-MM-DD). Mutually exclusive with range.
          explode: false
          in: query
          name: from
          schema:
            description: Inclusive lower bound on started_at (YYYY-MM-DD). Mutually exclusive with range.
            type: string
        - description: Exclusive upper bound on started_at (YYYY-MM-DD). Mutually exclusive with range.
          explode: false
          in: query
          name: to
          schema:
            description: Exclusive upper bound on started_at (YYYY-MM-DD). Mutually exclusive with range.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageTopRatedMatchItem"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Top rated matches
      tags:
        - matches
  /api/matches/{matchId}:
    get:
      description: Returns the full match including all rounds, per-player stats, per-weapon breakdowns, and objective contributions.
      operationId: get-match
      parameters:
        - description: Match UUID
          in: path
          name: matchId
          required: true
          schema:
            description: Match UUID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get match detail
      tags:
        - matches
  /api/matches/{matchId}/clips:
    get:
      description: Returns published clips linked to a match — backs the match page's highlight-reel section. ?kind=vod returns full broadcasts instead, each carrying the seek offsets for match start and every map play. Those offsets are approximate (they reconcile Twitch's clock with the match's round timestamps) and carry a 30s lead-in.
      operationId: list-match-clips
      parameters:
        - description: Match UUID
          in: path
          name: matchId
          required: true
          schema:
            description: Match UUID
            type: string
        - description: Highlights (clip) or full broadcasts (vod) — the match page renders each in its own section.
          explode: false
          in: query
          name: kind
          schema:
            default: clip
            description: Highlights (clip) or full broadcasts (vod) — the match page renders each in its own section.
            enum:
              - clip
              - vod
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMatchClipsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List clips or VODs for a match
      tags:
        - clips
  /api/matches/{matchId}/comments:
    get:
      description: The match's comment thread, returned as a flat list already in render order with a depth on each row — the client nests it without sorting. Comments are Markdown source. Removed and hidden comments come back as tombstones with a null body so their replies keep their context.
      operationId: list-match-comments
      parameters:
        - description: Match UUID
          in: path
          name: matchId
          required: true
          schema:
            description: Match UUID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMatchCommentsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Match comments
      tags:
        - matches
    post:
      description: Posts a comment or, with parent_id, a reply. Open to any logged-in account old enough to comment — playing in the match is not required, it only earns a badge. A reply deeper than the configured cap attaches at the cap rather than being refused.
      operationId: create-match-comment
      parameters:
        - description: Match UUID
          in: path
          name: matchId
          required: true
          schema:
            description: Match UUID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatchCommentInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchComment"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Post a match comment
      tags:
        - matches
  /api/matches/{matchId}/comments/{commentId}:
    delete:
      description: Soft delete. An author's own removal hides the body but KEEPS the edit history public, so deleting is not a way around the edit log; a moderator's removal hides the history too. The row survives either way so replies underneath keep their context.
      operationId: delete-match-comment
      parameters:
        - description: Match UUID
          in: path
          name: matchId
          required: true
          schema:
            description: Match UUID
            type: string
        - description: Comment UUID
          in: path
          name: commentId
          required: true
          schema:
            description: Comment UUID
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Remove a match comment
      tags:
        - matches
    patch:
      description: "Replaces the body and preserves the previous text as a publicly readable revision. Author only, with no grace period — every change is recorded from the first second. An edit that changes nothing writes no revision. Moderators deliberately cannot edit: they can hide a comment, but not rewrite it."
      operationId: update-match-comment
      parameters:
        - description: Match UUID
          in: path
          name: matchId
          required: true
          schema:
            description: Match UUID
            type: string
        - description: Comment UUID
          in: path
          name: commentId
          required: true
          schema:
            description: Comment UUID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMatchCommentInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchComment"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Edit a match comment
      tags:
        - matches
  /api/matches/{matchId}/comments/{commentId}/reactions:
    delete:
      description: Removes one emoji reaction and returns the comment's refreshed tallies. Idempotent, and deliberately not rate limited — undoing a misclick must never be the request that hits a limit.
      operationId: unreact-to-comment
      parameters:
        - description: Match UUID
          in: path
          name: matchId
          required: true
          schema:
            description: Match UUID
            type: string
        - description: Comment UUID
          in: path
          name: commentId
          required: true
          schema:
            description: Comment UUID
            type: string
        - description: The reaction to remove
          explode: false
          in: query
          name: emoji
          required: true
          schema:
            description: The reaction to remove
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactToCommentOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Remove a comment reaction
      tags:
        - matches
    put:
      description: Adds one emoji reaction and returns the comment's refreshed tallies. Idempotent — reacting twice with the same emoji leaves one reaction. Open to any logged-in account old enough to comment; reactions never affect the thread's ordering, which stays oldest-first.
      operationId: react-to-comment
      parameters:
        - description: Match UUID
          in: path
          name: matchId
          required: true
          schema:
            description: Match UUID
            type: string
        - description: Comment UUID
          in: path
          name: commentId
          required: true
          schema:
            description: Comment UUID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactToCommentInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactToCommentOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: React to a comment
      tags:
        - matches
  /api/matches/{matchId}/comments/{commentId}/report:
    post:
      description: "Queues a comment for moderator review and fires the moderation webhook. There is deliberately no auto-hide threshold, unlike clips: a couple of friendly reports would otherwise let an author retire their own comment with no moderator and no visible trail."
      operationId: report-match-comment
      parameters:
        - description: Match UUID
          in: path
          name: matchId
          required: true
          schema:
            description: Match UUID
            type: string
        - description: Comment UUID
          in: path
          name: commentId
          required: true
          schema:
            description: Comment UUID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportMatchCommentInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - cookieAuth: []
      summary: Report a match comment
      tags:
        - matches
  /api/matches/{matchId}/comments/{commentId}/restore:
