      tags:
        - clips
    post:
      description: Submit a Twitch/YouTube/Streamable clip link. Auto-approved for Twitch clips with a matching game_id from an active/trusted account; otherwise queued for moderator review. Resubmitting an already-known clip merges tags and bumps its submission_count instead of erroring.
